
[startup]
	#Preload Forge path resource pack indexes on Lightspeed worker threads during startup.
	asyncPreloadPacks = true
	#Use Lightspeed's bounded startup pool for resource reload preparation; manual reloads after the title screen use Minecraft's live executor.
	dedicatedResourceReloadExecutor = true
	#Use indexed resource lookup for safe pack segments while preserving vanilla priority and filter order.
	parallelResourceLookup = true
	#Cache per-pack resource existence checks. The persisted cache is loaded lazily so it does not block startup IO.
	cacheResourceExistence = true
	#Show the completed JVM-to-menu startup time on the title screen. Does not affect startup timing or log output.
	showStartupTime = true
	#Enable writing Lightspeed's -javaagent bootstrap arguments into detected launcher profiles for faster startup. Opt-in via the in-game prompt or config.
	installBootstrapAgent = false
	#Validate persisted per-mod resource caches with the full JAR SHA-256 instead of the default file identity. Reads each JAR once per launch; changing this option requires a restart and rebuilds these caches.
	verifyJarHash = false
	#Do not show the Java runtime recommendation after startup.
	suppressStartupRecommendations = true

[compatibility]
	#Opt in to isolating failures owned by explicitly configured third-party resource reload listener classes.
	isolateModdedResourceReloadFailures = true
	#Explicit class-name prefixes that may be isolated when resource reload fails. Wildcards are rejected so unrelated failures remain visible.
	isolatedResourceReloadListenerPatterns = []

