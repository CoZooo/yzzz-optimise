
[cyber_psychosis]
	#初始爆头概率，范围：0.0-1.0，推荐：0.3-0.6
	#0.50 表示 50% 的初始爆头率
	#Range: 0.0 ~ 1.0
	initialChance = 0.5
	#每次攻击增加的爆头概率（未爆头时），范围：0.0-0.5，推荐：0.05-0.15
	#0.10 表示每次未爆头的攻击增加 10% 爆头率
	#Range: 0.0 ~ 0.5
	chanceIncrement = 0.1
	#最大爆头概率，范围：0.0-1.0，推荐：0.6-1.0
	#0.80 表示最高 80% 爆头率
	#Range: 0.0 ~ 1.0
	maxChance = 0.8
	#累计概率重置时间（tick），范围：0-6000，推荐：100-400（5-20秒）
	#20 tick = 1 秒，超过此时间未攻击则重置爆头率
	#Range: 0 ~ 6000
	resetAfterTicks = 200
	#每达到多少点幸运值计算一档调整，范围：0.01-1000.00，推荐：1.00
	#正幸运降低初始累计值，负幸运提高初始累计值
	#Range: 0.01 ~ 1000.0
	luckPerPenaltyStep = 1.0
	#每档调整的初始爆头累计值，范围：0.00-1.00，推荐：0.10
	#内部累计值允许低于 0，实际爆头概率仍限制在 0 到 maxChance
	#Range: 0.0 ~ 1.0
	initialChanceReductionPerStep = 0.1

