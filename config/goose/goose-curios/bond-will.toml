
[bond_will]
	#伤害加成增长速率（每秒），范围：0.0-100.0，推荐：0.05-0.20
	#过高的值会导致玩家瞬间达到满加成，破坏游戏平衡
	#Range: 0.0 ~ 100.0
	bonusPerSecond = 2.5
	#最大伤害加成，范围：0.0-100.0，推荐：0.3-1.0
	#1.0 表示 100% 加成（双倍伤害）
	#Range: 0.0 ~ 100.0
	maxBonus = 10.0
	#脱离战斗所需时间（tick），范围：0-6000（0-5分钟），推荐：60-200（3-10秒）
	#20 tick = 1 秒
	#Range: 0 ~ 6000
	outOfCombatTicks = 20
	#触发隐身所需的瞄准进度，范围：0.0-1.0，推荐：0.8-0.95
	#0.0 = 不瞄准也可触发，1.0 = 必须完全瞄准
	#Range: 0.0 ~ 1.0
	aimingProgressThreshold = 0.8
	#冷却期间的伤害削减比例，范围：0.0-1.0，推荐：0.5-0.9
	#0.9 = 削减 90% 伤害（仅造成 10% 伤害）
	#Range: 0.0 ~ 1.0
	cooldownDamageReduction = 0.85
	#时停效果半径（方块），范围：8.0-128.0，推荐：30.0-64.0
	#30.0 表示以玩家为中心 30 格半径内的实体会被冻结
	#较大的值会增加性能消耗
	#Range: 8.0 ~ 128.0
	timeStopRadius = 24.0
	#时停扫描间隔（tick），范围：1-20，推荐：4-8
	#4 表示每 0.2 秒扫描一次（20 tick = 1 秒）
	#较小的值更精确但消耗更多性能，较大的值更节省性能
	#Range: 1 ~ 20
	timeStopScanInterval = 4
	#时停持续时间（tick），范围：20-1200（1-60秒），推荐：100-400（5-20秒）
	#200 表示时停持续 10 秒（20 tick = 1 秒）
	#达到满伤害加成后可触发时停效果
	#Range: 20 ~ 1200
	timeStopDuration = 100

