
[nine_demons_nine_calamities]
	#快捷栏中计算的最大魔杖种类数，范围：1-9，推荐：6-9
	#Range: 1 ~ 9
	max_wands = 9
	#第一根魔杖的基础加成（百分比），范围：0-50，推荐：5-15
	#9.0 表示 9% 伤害加成
	#Range: 0.0 ~ 50.0
	first_wand_bonus_percent = 9.0
	#每增加一根魔杖的加成衰减（百分比），范围：0-10，推荐：0.5-2.0
	#衰减机制防止无限堆叠魔杖
	#Range: 0.0 ~ 10.0
	bonus_decay_per_wand_percent = 1.0
	#单根魔杖的最小加成（百分比），范围：0-10，推荐：0.5-2.0
	#确保即使衰减后每根魔杖仍有最低收益
	#Range: 0.0 ~ 10.0
	min_wand_bonus_percent = 1.0
	#施法加成：每根魔杖贡献的额外加成（百分比），范围：0-10，推荐：0.5-3.0
	#此加成在施放匹配流派的法术时生效
	#Range: 0.0 ~ 10.0
	cast_bonus_per_wand_percent = 1.5
	#施法加成持续时间（tick），范围：1-72000（1tick-1小时），推荐：60-200（3-10秒）
	#20 tick = 1 秒
	#Range: 1 ~ 72000
	cast_bonus_duration_ticks = 200

