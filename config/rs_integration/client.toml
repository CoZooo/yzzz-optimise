	#高亮边缘
	#格式：#RRGGBB 或 #AARRGGBB。默认：#F0F0F5
	highlight = "#F0F0F5"
	#网格分隔线
	#格式：#RRGGBB 或 #AARRGGBB。默认：#CFD0DC
	gridLine = "#CFD0DC"
	#面板投影
	#格式：#RRGGBB 或 #AARRGGBB。默认：#50000000
	panelShadow = "#50000000"
	#面板顶部亮边
	#格式：#RRGGBB 或 #AARRGGBB。默认：#F1F1F5
	panelTopEdge = "#F1F1F5"
	#面板左侧亮边
	#格式：#RRGGBB 或 #AARRGGBB。默认：#E5E6ED
	panelLeftEdge = "#E5E6ED"
	#按钮底部与右侧暗边
	#格式：#RRGGBB 或 #AARRGGBB。默认：#9294A5
	edgeShadow = "#9294A5"
	#计划图标底色
	#格式：#RRGGBB 或 #AARRGGBB。默认：#F6FAFC
	iconPaper = "#F6FAFC"
	#监控器计划图标底色
	#格式：#RRGGBB 或 #AARRGGBB。默认：#ECEAF1
	monitorIconPaper = "#ECEAF1"
	#普通按钮背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#A6ABC0
	button = "#A6ABC0"
	#普通按钮悬停背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#B8BDCF
	buttonHover = "#B8BDCF"
	#主按钮悬停背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#777E9C
	buttonPrimaryHover = "#777E9C"
	#禁用按钮背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#B9BCCB
	buttonDisabled = "#B9BCCB"
	#按钮文字
	#格式：#RRGGBB 或 #AARRGGBB。默认：#F7F7FA
	buttonText = "#F7F7FA"
	#侧栏按钮悬停背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#E4E2EB
	sideButtonHover = "#E4E2EB"
	#列表卡片与输入框背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#FFFFFF
	row = "#FFFFFF"
	#计划卡片悬停背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#E6F3F8
	rowHover = "#E6F3F8"
	#监控器选中任务背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#B8DCF2
	selectedRow = "#B8DCF2"
	#监控器搜索框背景
	#格式：#RRGGBB 或 #AARRGGBB。默认：#DFE1EA
	input = "#DFE1EA"
	#滚动条滑块
	#格式：#RRGGBB 或 #AARRGGBB。默认：#9CA1BA
	scrollbar = "#9CA1BA"
	#滚动条滑块悬停
	#格式：#RRGGBB 或 #AARRGGBB。默认：#BBC0D5
	scrollbarHover = "#BBC0D5"
	#无滚动内容时的滑块
	#格式：#RRGGBB 或 #AARRGGBB。默认：#B3B5C4
	scrollbarDisabled = "#B3B5C4"
	#禁用滑块边框
	#格式：#RRGGBB 或 #AARRGGBB。默认：#858798
	scrollbarDisabledBorder = "#858798"
	#滑块握柄
	#格式：#RRGGBB 或 #AARRGGBB。默认：#5E6279
	scrollbarGrip = "#5E6279"
	#禁用滑块握柄
	#格式：#RRGGBB 或 #AARRGGBB。默认：#8D90A2
	scrollbarDisabledGrip = "#8D90A2"
	#材料状态：已有库存
	#格式：#RRGGBB 或 #AARRGGBB。默认：#A1A5BB
	materialStored = "#A1A5BB"
	#材料状态：正在合成
	#格式：#RRGGBB 或 #AARRGGBB。默认：#88B0AD
	materialRunning = "#88B0AD"
	#材料状态：等待合成
	#格式：#RRGGBB 或 #AARRGGBB。默认：#C3B887
	materialScheduled = "#C3B887"
	#材料状态：缺料或阻塞
	#格式：#RRGGBB 或 #AARRGGBB。默认：#C6929B
	materialBlocked = "#C6929B"
	#材料状态：正在停止
	#格式：#RRGGBB 或 #AARRGGBB。默认：#B3A0C4
	materialStopping = "#B3A0C4"
	#材料状态：已完成
	#格式：#RRGGBB 或 #AARRGGBB。默认：#A4B89A
	materialCompleted = "#A4B89A"
	#监控器主题
	#只切换合成监控器和计划列表，无需重启；递归树使用独立的 treeTheme。
	#CUSTOM：使用下方颜色和 plan_ui.toml 的自定义配色（保留已有设置）。
	#FOREST：森林绿；OCEAN：冰川蓝；AMETHYST：丁香紫；WARM_PAPER：暖纸色。
	#VANILLA：原版灰；BRASS：黄铜工坊；ARCANE：绯月秘法；QUARTZ：石英终端。
	#ROSE：樱霞；EMBER：余烬；GRAPHITE：石墨。
	#FROSTED_GLASS：高透磨砂玻璃；BLACK_GLASS：高透黑玻璃。
	#DEEP_SPACE：宇宙深空。
	#预设模式下暂不使用自定义颜色；切回 CUSTOM 即可恢复，布局不受影响。
	#Allowed Values: CUSTOM, FOREST, OCEAN, AMETHYST, WARM_PAPER, VANILLA, BRASS, ARCANE, QUARTZ, ROSE, EMBER, GRAPHITE, FROSTED_GLASS, BLACK_GLASS, DEEP_SPACE
	theme = "WARM_PAPER"
	#递归树主题
	#只影响递归树、材料表及树内控件，不改变监控器配色。
	#Allowed Values: CUSTOM, FOREST, OCEAN, AMETHYST, WARM_PAPER, VANILLA, BRASS, ARCANE, QUARTZ, ROSE, EMBER, GRAPHITE, FROSTED_GLASS, BLACK_GLASS, DEEP_SPACE
	treeTheme = "WARM_PAPER"
	#独立主题配置迁移版本；由程序维护。
	#Range: 0 ~ 1
	themeSchema = 1

#计算任务提示；默认屏幕右侧居中，打开界面时隐藏。
[planningHud]
	#位置配置迁移版本，由模组自动维护。
	#Range: > 0
	layoutVersion = 1
	#显示计算状态和打开计划的快捷键提示。
	visible = true
	#提示在可用区域内的水平位置：0 左侧，1 右侧。
	#Range: 0.0 ~ 1.0
	horizontalPosition = 1.0
	#提示在可用区域内的垂直位置：0 顶部，1 底部。
	#默认右侧居中；可按其他 HUD 的位置调整。
	#Range: 0.0 ~ 1.0
	verticalPosition = 0.5

