
#侧边面板
[sidePanel]
	#侧边面板水平位置
	#侧边面板左边缘的水平屏幕坐标，单位为像素。
	#Range: 0 ~ 4000
	x = 100
	#侧边面板垂直位置
	#侧边面板上边缘的垂直屏幕坐标，单位为像素。
	#Range: 0 ~ 4000
	y = 100
	#侧边面板宽度（0 为默认）
	#侧边面板宽度，单位为像素；0 使用 RS 默认宽度 247。
	#Range: 0 ~ 600
	width = 0
	#侧边面板高度（0 为自动）
	#侧边面板高度，单位为像素；0 按网格行数自动计算。
	#Range: 0 ~ 600
	height = 0
	#折叠侧边面板
	#将侧边面板折叠为窄条。
	hidden = false
	#远程界面返回等待（毫秒）
	#从远程机器界面返回 RS 网格的最长等待时间；超时丢弃旧导航状态。
	#Range: 1000 ~ 30000
	navigationTimeoutMs = 5000

#网格搜索
[gridSearch]
	#后台预热预算（微秒 / tick）
	#RS 网格未执行特殊搜索时，每个客户端 tick 用于后台预热搜索索引的时间预算。
	#范围：100-10000 微秒。
	#Range: 100 ~ 10000
	idleBudgetMicros = 1000
	#搜索计算预算（微秒 / tick）
	#正在等待 @、# 或 $ 搜索时，每个客户端 tick 用于索引和匹配的时间预算。
	#范围：500-10000 微秒。
	#Range: 500 ~ 10000
	activeBudgetMicros = 3000
	#输入防抖等待（毫秒）
	#输入停止后开始执行特殊搜索的等待时间，避免每输入一个字符都重复扫描。
	#范围：0-500 毫秒。
	#Range: 0 ~ 500
	debounceMs = 80
	#部分结果刷新间隔（毫秒）
	## 搜索索引尚未完成时，部分结果刷新到网格的最小间隔。
	#较小的值响应更快，较大的值可减少网格重排。范围：16-500 毫秒。
	#Range: 16 ~ 500
	partialRefreshMs = 50
	#搜索结果缓存条数
	#保留的 @、#、$ 单项搜索结果数量，用于重复搜索和继续输入时复用结果。
	#范围：8-128。
	#Range: 8 ~ 128
	queryCacheEntries = 16
	#空快照保留等待（毫秒）
	#RS 重建网格视图时，保留上一份非空搜索快照的等待时间。
	#用于忽略短暂的空列表，避免清空并重建全部索引。范围：0-2000 毫秒。
	#Range: 0 ~ 2000
	emptySnapshotGraceMs = 250
	#倒排候选占比上限（%）
	#倒排索引候选占当前可搜索条目的比例上限。
	#超过该比例时直接分片扫描，避免为接近全集的候选额外复制和求交。范围：10-100。
	#Range: 10 ~ 100
	candidateIndexMaxPercent = 60
	#候选索引重建间隔（毫秒）
	#搜索文本开始成批就绪后，按多长间隔在后台重建倒排索引。
	#连续预热期间会合并更新，同时保留动态结果，避免为每个物品重复发布。范围：0-2000 毫秒。
	#Range: 0 ~ 2000
	candidateRebuildDelayMs = 100
	#拼音索引后台线程数
	#用于生成 # 搜索拼音索引的后台线程数。
	#Minecraft tooltip 本身仍在客户端线程采集；只有纯文本转拼音在后台运行。
	#范围：1-4。
	#Range: 1 ~ 4
	pinyinWorkers = 2
	#启用磁盘搜索缓存
	#将已经完成的 RS tooltip 与拼音搜索文本保存到本地磁盘。
	#再次启动客户端时可直接复用，避免每次进入世界都重新冷预热。
	diskCacheEnabled = true
	#磁盘搜索缓存条目上限
	#磁盘搜索缓存最多保留的物品/流体变体数量。
	#缓存键包含类型、注册名和 NBT，不包含数量。范围：1000-100000。
	#Range: 1000 ~ 100000
	diskCacheEntries = 20000
	#磁盘搜索缓存容量（MiB）
	#压缩搜索缓存允许使用的最大磁盘空间。范围：4-256 MiB。
	#Range: 4 ~ 256
	diskCacheMaxMiB = 32
	#磁盘搜索缓存保存等待（毫秒）
	#最后一次补全 tooltip 后延迟多久异步写回磁盘。
	#较长的延迟可以合并连续写入。范围：500-30000 毫秒。
	#Range: 500 ~ 30000
	diskCacheSaveDelayMs = 2000
	#轻量显示拔刀剑图标
	#在 RS 网格和 JEI 物品列表中使用轻量的 SlashBlade 图标渲染。
	#保留刀身与纹理，但省略发光、3D 耐久装饰和附魔的重复模型绘制。
	lightweightSlashBladeRendering = false

#搜索历史
[recentSearch]
	#显示最近搜索记录
	#在 RS 网格搜索框下方显示按世界或服务器隔离的最近搜索记录。
	enabled = true
	#搜索记录显示条数
	#搜索浮层最多显示的历史记录数量。范围：1-20。
	#Range: 1 ~ 20
	maxVisibleEntries = 8
	#搜索记录保存条数
	#每个玩家在每个世界或服务器最多保存的搜索记录数量。范围：10-1000。
	#达到上限时优先删除最旧的非收藏记录。
	#Range: 10 ~ 1000
	maxStoredEntries = 100
	#允许收藏搜索记录
	#允许收藏搜索记录并将收藏项显示在普通记录之前。
	favoritesEnabled = true
	#显示搜索记录删除按钮
	#在搜索历史浮层中显示单条删除和清空按钮。
	deleteButtonsEnabled = true

#遥远世界
[distantWorlds]
	#显示祭坛状态
	#看向核心时显示祭坛状态。
	enableHud = true

#自动进食
[autoEat]
	#展开自动进食菜单
	#记住自动进食菜单是否展开。
	menuExpanded = true

#JEI 标记
[jeiOverlay]
	#JEI 网络库存字号比例
	#JEI 物品槽右下角白色网络库存数字的缩放比例，只影响本地显示。
	#Range: 0.4 ~ 1.0
	networkCountScale = 0.7
	#JEI 合成缺料字号比例
	#JEI 物品槽左上角红色缺料数字的最大缩放比例；过长数字仍会自动缩小。
	#Range: 0.4 ~ 1.0
	craftingShortageScale = 0.75

#Tetra 预览
[tetra]
	#保留 JEI 材料悬停预览
	#鼠标离开 JEI 材料后保留最近的悬停预览；目标、槽位、蓝图或工作台变化时清除。
	keepJeiMaterialPreview = true

