
#存储维护
#RS 原版存储维护。布尔开关在配置重新加载后生效；终端传输选项需要重启。
[storage]
	#合并重复连接缓存重建
	#节点连接和解绑完成后，合并排队的重复缓存重建。数量增量不受影响。
	mergeConnectionRebuilds = true
	#校验存储文件保存
	#保存 RS 数据前写入并校验临时文件，成功替换后才清除 dirty。失败等待下次保存。
	verifySaves = true
	#重建后刷新已打开的终端
	#缓存完整重建后刷新打开的物品、流体及便携终端。会发送完整列表。
	refreshOpenGrids = true
	#提高终端完整列表拆包上限
	#提高终端完整列表消息的拆包上限，不改变客户端请求上限。需要重启。
	expandGridTransfer = true
	#终端完整列表拆包数量上限
	#终端完整列表允许的最大拆包数量；原版通常为 10。数值越大，传输和内存成本越高。需要重启。
	#Range: 10 ~ 2000
	gridTransferParts = 100
	#取出流体前检查容器
	#流体终端扣减库存前，模拟检查一桶流体是否可提取及装桶。
	checkFluidContainer = true

#混合终端
#联网普通终端和合成终端的物品/流体混合显示。服务端决定是否启用，重新打开菜单生效。
[unifiedGrid]
	#启用物品 / 流体混合终端
	#默认开启。关闭后使用 RS 原版单类型订阅、显示和取放路径。
	enabled = true

#万界归墟盘
#物品/流体万界归墟盘。开关需重启，关闭不删除库存；条目容量调大后旧盘在下次加载时自动扩容，调小不缩容。载荷容量只影响新盘。
[unifiedDisk]
	#启用万界归墟盘
	#默认开启。关闭后在创造栏和配方浏览器隐藏并禁用配方，保留旧盘与文件但不挂载和读写库存。需要重启。
	enabled = true
	#统一盘物品种类上限
	#每个万界归墟盘可存储的物品种类上限。调大后旧盘在下次加载时扩容，调小不缩容。
	#Range: 1 ~ 262144
	maxItemEntries = 262144
	#统一盘流体种类上限
	#每个万界归墟盘可存储的流体种类上限。调大后旧盘在下次加载时扩容，调小不缩容。
	#Range: 1 ~ 262144
	maxFluidEntries = 262144
	#单条目数据容量（字节）
	#单个物品或流体条目序列化后的数据大小上限，单位为字节。
	#Range: 1024 ~ 1048576
	maxPayloadBytesPerEntry = 1048576
	#单磁盘数据容量（字节）
	#每个新建万界归墟盘的数据载荷容量上限，单位为字节。不改变旧盘容量。
	#Range: 1048576 ~ 536870912
	maxPayloadBytesPerDisk = 268435456

